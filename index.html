<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 첫 GitHub Pages</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      color: white;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      padding: 50px 40px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }
    h1 {
      font-size: 2.2em;
      margin-bottom: 10px;
    }
    p {
      font-size: 1.1em;
      opacity: 0.9;
    }
    .badge {
      display: inline-block;
      margin-top: 20px;
      padding: 8px 18px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎉 성공!</h1>
    <p>GitHub Pages로 페이지를 공개하는 데 성공했지요(수정해볼게요)</p>
    <div class="badge">index.html이 정상적으로 열렸습니다(지금 두번째 수정이야)</div>
  </div>
</body>
</html>
